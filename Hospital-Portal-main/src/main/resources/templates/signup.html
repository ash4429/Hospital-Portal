<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-lg border border-slate-100">
        <h2 class="text-3xl font-bold text-slate-800 mb-2">Join MedPortal</h2>
        <p class="text-slate-500 mb-8">Secure your medical future today.</p>
        
        <form action="/web/signup" method="POST" class="grid grid-cols-1 gap-6">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Full Name</label>
                <input type="text" name="name" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Mobile Number</label>
                <input type="text" name="mobno" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Create Password</label>
                <input type="password" name="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <button type="submit" class="bg-slate-900 text-white py-4 rounded-xl font-bold text-lg hover:bg-slate-800 transition">
                Create Account
            </button>
        </form>
        <p class="mt-6 text-center text-slate-500">Already registered? <a href="/login" class="text-teal-600 font-bold">Login here</a></p>
    </div>
</body>
</html>
