<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedPortal | Smart Healthcare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans">
    <!-- Hero Section -->
    <nav class="flex justify-between items-center px-10 py-6 bg-white shadow-sm">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-heart-pulse text-teal-600 text-3xl"></i>
            <span class="text-2xl font-bold text-slate-800 tracking-tight">MedPortal</span>
        </div>
        <div class="space-x-6">
            <a href="/login" class="text-slate-600 font-semibold hover:text-teal-600 transition">Login</a>
            <a href="/signup" class="bg-teal-600 text-white px-6 py-2.5 rounded-full font-bold hover:bg-teal-700 shadow-lg shadow-teal-200 transition">Get Started</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-20 flex flex-col lg:flex-row items-center gap-12">
        <div class="lg:w-1/2 space-y-8">
            <h1 class="text-6xl font-extrabold text-slate-900 leading-tight">
                Your Health, <span class="text-teal-600">Simplified</span> and Secure.
            </h1>
            <p class="text-xl text-slate-600 leading-relaxed">
                Join our community to discuss health concerns, upload and track your medical reports, and find the best-rated hospitals in your city.
            </p>
            <div class="flex gap-4">
                <a href="/signup" class="bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold text-lg hover:bg-slate-800 transition">Create ABHA Account</a>
                <a href="/web/forum" class="border-2 border-slate-200 text-slate-700 px-8 py-4 rounded-2xl font-bold text-lg hover:bg-slate-50 transition">Browse Forum</a>
            </div>
        </div>
        <div class="lg:w-1/2">
            <img src="https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&q=80&w=800" class="rounded-3xl shadow-2xl border-8 border-white">
        </div>
    </main>
</body>
</html>
