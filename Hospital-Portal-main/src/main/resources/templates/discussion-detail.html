<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .med-gradient { background: linear-gradient(135deg, #0d9488 0%, #0ea5e9 100%); }
    </style>
</head>
<body class="bg-slate-50">
    <!-- Navigation (Assuming it's there) -->
    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="max-w-4xl mx-auto py-10 px-4">
        <!-- Back Button -->
        <div class="mb-6">
            <a href="/web/forum" class="inline-flex items-center text-slate-500 hover:text-teal-600 font-bold transition">
                <i class="fa-solid fa-chevron-left mr-2 text-xs"></i> Back to Community
            </a>
        </div>

        <!-- Main Discussion Card -->
        <article class="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden mb-10">
            <div class="p-8 md:p-10">
                 <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center space-x-4">
                        <div class="w-14 h-14 rounded-2xl med-gradient flex items-center justify-center text-white shadow-lg font-bold text-xl"
                             th:text="${#strings.substring(discussion.authorName,0,1)}">A</div>
                        <div>
                            <h4 class="font-bold text-slate-900 text-lg" th:text="${discussion.authorName}">User Name</h4>
                            <p class="text-sm text-slate-400">
                                <i class="fa-regular fa-calendar-check mr-1"></i> 
                                <span th:text="${#temporals.format(discussion.createdTime, 'dd MMM yyyy, HH:mm')}">Time</span>
                            </p>
                        </div>
                    </div>
                    <span class="bg-teal-50 text-teal-700 text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-widest border border-teal-100" 
                          th:text="${discussion.hospitalName != null ? discussion.hospitalName : 'General Consultation'}">Hospital</span>
                </div>
                <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-6 leading-tight" th:text="${discussion.title}">Discussion Title</h1>
                <div class="prose max-w-none text-slate-600 leading-relaxed text-lg bg-slate-50/50 p-6 rounded-2xl border border-slate-50" th:text="${discussion.content}">Content here...</div>
            </div>
        </article>

        <!-- Post an Answer Form (Light Theme) -->
        <div class="mt-8 mb-12 bg-white rounded-[2.5rem] p-8 md:p-12 shadow-sm border-2 border-teal-500/10 relative overflow-hidden">
            <div class="relative z-10">
                <div class="flex items-center mb-6">
                    <div class="w-12 h-12 rounded-2xl bg-teal-50 flex items-center justify-center text-teal-600 mr-4">
                        <i class="fa-solid fa-pen-nib text-xl"></i>
                    </div>
                    <div>
                        <h4 class="text-2xl font-bold text-slate-900">Share your wisdom</h4>
                        <p class="text-slate-500">Your insights could help someone make a better health decision.</p>
                    </div>
                </div>
                
                <form th:action="@{'/web/forum/discussion/' + ${discussion.id} + '/answer'}" method="POST">
                    <textarea name="answer" rows="5" required
                        class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-2xl p-5 focus:ring-2 focus:ring-teal-500 focus:bg-white mb-6 placeholder-slate-400 outline-none transition-all shadow-inner"
                        placeholder="Write your advice or medical experience here..."></textarea>
                    
                    <div class="flex justify-end">
                        <button type="submit" class="med-gradient text-white px-10 py-4 rounded-xl font-bold hover:shadow-lg hover:-translate-y-1 transition-all flex items-center">
                            <i class="fa-solid fa-paper-plane mr-2"></i> Submit Response
                        </button>
                    </div>
                </form>
            </div>
            <i class="fa-solid fa-stethoscope absolute -right-8 -bottom-8 text-[10rem] text-teal-500/5 -rotate-12"></i>
        </div>

        <!-- Answers Section -->
        <div class="space-y-8">
            <h3 class="text-2xl font-bold text-slate-800 px-2">
                <i class="fa-solid fa-comment-medical text-teal-600 mr-2"></i> 
                Community Insights (<span th:text="${discussion.answer != null ? discussion.answer.size() : 0}">0</span>)
            </h3>

            <div th:if="${#lists.isEmpty(discussion.answer)}" class="bg-white p-10 rounded-3xl text-center border border-dashed border-slate-200">
                <p class="text-slate-500">No responses yet.</p>
            </div>

            <div th:each="ans : ${discussion.answer}" class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 hover:border-teal-100 transition-colors">
                <!-- Answer Content -->
                <div class="flex items-start space-x-5">
                    <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-teal-600 font-bold" th:text="${#strings.substring(ans.responderName,0,1)}">R</div>
                    <div class="flex-1">
                        <h5 class="font-bold text-slate-800" th:text="${ans.responderName}">Name</h5>
                        <p class="text-slate-600 mt-2" th:text="${ans.answer}">The response...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
