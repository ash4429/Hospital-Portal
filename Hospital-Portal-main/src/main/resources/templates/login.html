<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css}"></head>
<body class="bg-teal-600 flex items-center justify-center min-h-screen p-4">
    
    <div class="bg-white p-8 md:p-12 rounded-[3rem] shadow-2xl w-full max-w-md border border-white/20 animate-med">
        <div class="text-center mb-10">
            <div class="w-20 h-20 med-gradient rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-teal-900/20 rotate-3 hover:rotate-0 transition-transform duration-500">
                <i class="fa-solid fa-shield-heart text-white text-3xl"></i>
            </div>
            <h2 class="text-4xl font-extrabold text-slate-800 tracking-tight">Secure Access</h2>
            <p class="text-slate-500 font-medium mt-2">Log in to your encrypted health portal</p>
        </div>

        <!-- Error Alert -->
        <div th:if="${param.error}" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-xl flex items-center text-sm font-bold">
            <i class="fa-solid fa-circle-exclamation mr-3"></i> 
            Invalid credentials. Please try again.
        </div>

        <form action="/web/login" method="POST" class="space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Full Name</label>
                <div class="relative">
                    <input type="text" name="name" required placeholder="John Doe"
                        class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 outline-none transition-all placeholder:text-slate-300">
                    <i class="fa-solid fa-user absolute right-5 top-1/2 -translate-y-1/2 text-slate-200"></i>
                </div>
            </div>
            
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Security Key</label>
                <div class="relative">
                    <input type="password" id="passInput" name="password" required placeholder="••••••••"
                        class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 outline-none transition-all placeholder:text-slate-300">
                    <button type="button" onclick="togglePass()" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-300 hover:text-teal-600 transition-colors">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full med-gradient text-white py-5 rounded-2xl font-bold text-lg hover:shadow-2xl hover:shadow-teal-900/30 transition-all hover:-translate-y-1 active:scale-95">
                Authorize & Enter
            </button>
        </form>

        <div class="mt-10 pt-8 border-t border-slate-50 text-center">
            <p class="text-slate-500 font-medium">New to MedPortal?</p>
            <a href="/signup" class="text-teal-600 font-bold hover:text-teal-700 transition-colors inline-block mt-2">Create ABHA Account</a>
        </div>
    </div>

    <script>
        function togglePass() {
            const input = document.getElementById('passInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
